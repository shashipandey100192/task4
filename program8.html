<body>



    <script>

        var mycolor = ["red", "green", "blue", "orange"];
        var a = 0;

        function abc() {
            document.bgColor = mycolor[a];
            a++;
            if (a == mycolor.length) {
                a = 0;
            }

        }

        // setInterval("abc()",500);

    
        // setInterval(function(){

        setInterval(()=>{
            abc();
        },1000)





    </script>
