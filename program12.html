<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .first
        {
            background-color: orangered;
            color:white;
        }
        .second
        {
            font-size: 50px;
        }
        .third
        {
            text-shadow: 2px 2px 5px black;
        }
    </style>
</head>
<body>

<input type="text">
<button>submit</button>
<h2>this is heading two</h2>
<span>this is inline</span>
<input type="color">



<script>

var myele = document.querySelectorAll('input,button,h2,span');
console.log(myele);

myele[0].addEventListener("input",()=>{
        var a = myele[0].value;
            console.log(a.length);
            if(a=="password")
            {
                myele[0].setAttribute("type","password");
            }
            else
            {
                 myele[0].setAttribute("type","text");
            }
            if(a.length>=15)
            {
                myele[0].value="too more";
            }
            
});


myele[1].addEventListener("click",()=>{
        myele[1].setAttribute("type","button");
        myele[1].setAttribute("title","userbutton");
});



myele[2].addEventListener("click",()=>{
    myele[2].classList.add("first","second","third");
});

myele[2].addEventListener("dblclick",()=>{
    myele[2].classList.remove("third");
})


myele[4].addEventListener("input",()=>{
    document.bgColor=myele[4].value;
})




</script>


</body>
</html>
