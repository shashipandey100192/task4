<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0 auto;
            padding: 0;
        }

        body {
            background-image: url('https://m.media-amazon.com/images/I/91Oa5T0HkdL.png');
            background-size: cover;
        }

        .model {
            width: 100%;
            height: 100%;
            background-color: rgba(100, 200, 150, 0.5);
            position: fixed;
            display: flex;
            align-items: center;
            visibility: hidden;
        }

        .model section {
            background-color: white;
            padding: 20px;

        }

        #close {
            color: white;
            background-color: red;
            padding: 5px;
            width: 30px;
            border: none;
            box-shadow: 2px 2px 2px #888181;
            position: absolute;
            margin: -29px 0px 0 166px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="model">

        <section>
            <input type="button" value="X" id="close">
            <h1>this is model</h1>
                     <h1>this is model</h1>
                              <h1>this is model</h1>
                                       <h1>this is model</h1>
                                                <h1>this is model</h1>
        </section>
    </div>



    <script>

      
        var mymodel;
         mymodel = document.querySelectorAll(".model,#close");
        function abc()
        {
       
            console.log(mymodel);
            mymodel[0].style.visibility="visible";
        }

        setTimeout("abc()",2000);


        mymodel[1].addEventListener("click",()=>{
            mymodel[0].style.visibility="hidden";
        })




    </script>



</body>

</html>
