```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Joining Letter</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #eeeeee;
            font-family: Arial, Helvetica, sans-serif;
            color: #222;
        }

        /* A4 Paper */
        .page {
            width: 210mm;
            min-height: 297mm;
            margin: auto;
            padding: 18mm 18mm 15mm;
            background: #ffffff;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
            position: relative;
        }

        /* Company Header */
        .company-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 3px solid #17365d;
        }

        .company-info h1 {
            margin: 0;
            font-size: 25px;
            color: #17365d;
            letter-spacing: 0.5px;
        }

        .company-info p {
            margin: 5px 0 0;
            font-size: 12px;
            color: #555;
        }

        .logo {
            width: 70px;
            height: 70px;
            border: 2px solid #17365d;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #17365d;
        }

        /* Document Information */
        .document-info {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 13px;
        }

        .document-info div {
            width: 48%;
        }

        .document-info strong {
            color: #17365d;
        }

        /* Title */
        .title {
            text-align: center;
            margin: 30px 0 25px;
        }

        .title h2 {
            display: inline-block;
            margin: 0;
            padding-bottom: 6px;
            border-bottom: 2px solid #17365d;
            color: #17365d;
            font-size: 21px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Employee Information */
        .employee-box {
            border: 1px solid #ccc;
            margin-bottom: 25px;
        }

        .employee-box h3 {
            margin: 0;
            padding: 9px 12px;
            background: #17365d;
            color: white;
            font-size: 14px;
        }

        .employee-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .detail {
            padding: 9px 12px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
        }

        .detail:nth-child(odd) {
            border-right: 1px solid #ddd;
        }

        .detail label {
            display: block;
            font-size: 11px;
            color: #777;
            margin-bottom: 3px;
        }

        .detail span {
            font-weight: 600;
        }

        /* Letter Content */
        .content {
            font-size: 13.5px;
            line-height: 1.7;
            text-align: justify;
        }

        .content p {
            margin: 0 0 15px;
        }

        .content strong {
            color: #17365d;
        }

        /* Terms */
        .terms {
            margin-top: 15px;
        }

        .terms h3 {
            font-size: 15px;
            color: #17365d;
            margin-bottom: 8px;
        }

        .terms ol {
            margin: 0;
            padding-left: 22px;
        }

        .terms li {
            margin-bottom: 7px;
            line-height: 1.55;
            font-size: 12.5px;
        }

        /* Signature */
        .signature-area {
            display: flex;
            justify-content: space-between;
            margin-top: 45px;
        }

        .signature {
            width: 42%;
            font-size: 12px;
        }

        .signature-line {
            margin-top: 45px;
            border-top: 1px solid #333;
            padding-top: 7px;
        }

        /* Footer */
        .footer {
            position: absolute;
            left: 18mm;
            right: 18mm;
            bottom: 10mm;
            border-top: 1px solid #ddd;
            padding-top: 7px;
            text-align: center;
            font-size: 10px;
            color: #777;
        }

        /* Print */
        @page {
            size: A4;
            margin: 0;
        }

        @media print {

            body {
                padding: 0;
                margin: 0;
                background: white;
            }

            .page {
                width: 210mm;
                min-height: 297mm;
                margin: 0;
                box-shadow: none;
            }

            .no-print {
                display: none !important;
            }
        }

        /* Print Button */
        .print-button {
            display: block;
            width: 160px;
            margin: 20px auto;
            padding: 11px;
            border: none;
            border-radius: 5px;
            background: #17365d;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .print-button:hover {
            background: #0d2948;
        }
    </style>
</head>

<body>

    <!-- Print Button -->
  
    <button class="print-button no-print" onclick="generateletter()">
       new letter
    </button>

    <!-- A4 Page -->
    <div class="page">



    </div>

</body>
</html>
