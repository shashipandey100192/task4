<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <h1></h1>

 <script>

function mydates()
{

var a =new Date();
console.log(a);
console.log(typeof a);
var m = a.getMinutes();
var s = a.getSeconds();
var h = a.getHours();
var y = a.getFullYear();

var mytime = `${h}:${m}:${s} | ${y}`;

var head = document.querySelector("h1");
    head.innerHTML=mytime;
}


setInterval("mydates()",1000);

 </script>   
    
</body>
</html>
